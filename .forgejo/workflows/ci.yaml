name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  PACKAGE_NAME: cowsay-rs
  PYTHON_VERSION: "3.13"
  NEXTEST_PROFILE: ci

# Every job runs in a container on the `docker` runner. The rust image has no
# Node.js, which JavaScript actions (checkout, rust-cache) need, so each job
# installs it from apt before checking out.
jobs:
  cargo-fmt:
    name: "cargo fmt"
    runs-on: docker
    container: rust:1.91-trixie
    timeout-minutes: 10
    steps:
      - name: "Install Node.js"
        run: apt-get update -qq && apt-get install -qq -y --no-install-recommends nodejs
      - uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Install Rust toolchain"
        run: rustup toolchain install
      - run: cargo fmt --all --check

  cargo-clippy:
    name: "cargo clippy"
    runs-on: docker
    container: rust:1.91-trixie
    timeout-minutes: 10
    steps:
      - name: "Install Node.js"
        run: apt-get update -qq && apt-get install -qq -y --no-install-recommends nodejs
      - uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Install Rust toolchain"
        run: rustup toolchain install
      - uses: https://github.com/Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: "Clippy"
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- \
          -D warnings
      - name: "Clippy WASM"
        run: |
          cargo clippy -p cowsay-wasm --target wasm32-unknown-unknown --all-features --locked -- \
          -D warnings

  cargo-test-linux:
    name: "cargo test (linux)"
    runs-on: docker
    container: rust:1.91-trixie
    timeout-minutes: 10
    steps:
      - name: "Install Node.js"
        run: apt-get update -qq && apt-get install -qq -y --no-install-recommends nodejs
      - uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Install Rust toolchain"
        run: rustup toolchain install
      - uses: https://github.com/Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: "Install cargo nextest"
        uses: https://github.com/taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-nextest
      - name: "Run tests"
        run: |
          cargo nextest run --all-features --profile ci
          cargo test --all-features --doc
      - name: "Check docs" # Check for broken links in the documentation.
        run: cargo doc --all --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  cargo-test-linux-release:
    name: "cargo test (linux, release)"
    runs-on: docker
    container: rust:1.91-trixie
    timeout-minutes: 10
    steps:
      - name: "Install Node.js"
        run: apt-get update -qq && apt-get install -qq -y --no-install-recommends nodejs
      - uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Install Rust toolchain"
        run: rustup toolchain install
      - uses: https://github.com/Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: "Install cargo nextest"
        uses: https://github.com/taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-nextest
      - name: "Run tests"
        run: cargo nextest run --all-features --profile ci --release

  cargo-test-wasm:
    name: "cargo test (wasm)"
    runs-on: docker
    container: rust:1.91-trixie
    timeout-minutes: 10
    steps:
      - name: "Install Node.js"
        run: apt-get update -qq && apt-get install -qq -y --no-install-recommends nodejs
      - uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Install Rust toolchain"
        run: rustup toolchain install
      - uses: https://github.com/Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: "Install wasm-pack"
        uses: https://github.com/taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: wasm-pack@0.13.1
      - name: "Test cowsay-wasm"
        working-directory: crates/cowsay-wasm
        run: wasm-pack test --node

  cargo-shear:
    name: "cargo shear"
    runs-on: docker
    container: rust:1.91-trixie
    timeout-minutes: 10
    steps:
      - name: "Install Node.js"
        run: apt-get update -qq && apt-get install -qq -y --no-install-recommends nodejs
      - uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Install cargo shear"
        uses: https://github.com/taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-shear
      - run: cargo shear

  cargo-audit:
    name: "cargo audit"
    runs-on: docker
    container: rust:1.91-trixie
    timeout-minutes: 10
    steps:
      - name: "Install Node.js"
        run: apt-get update -qq && apt-get install -qq -y --no-install-recommends nodejs
      - uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Install cargo audit"
        uses: https://github.com/taiki-e/install-action@81ee1d48d9194cdcab880cbdc7d36e87d39874cb # v2.62.45
        with:
          tool: cargo-audit
      - run: cargo audit

  pre-commit:
    name: "pre-commit"
    runs-on: docker
    container: node:24-trixie
    timeout-minutes: 10
    steps:
      - uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: "Install uv"
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: "Run pre-commit"
        # --hook-stage=manual enables slower pre-commit hooks that are skipped by default
        run: |
          ~/.local/bin/uvx --python="${PYTHON_VERSION}" pre-commit run --all-files \
            --show-diff-on-failure --color=always --hook-stage=manual
